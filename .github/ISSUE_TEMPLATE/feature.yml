name: Feature request
description: An idea for taskman.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        docs/roadmap.md lists ideas already agreed; if yours is there, say how you'd use it.
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The work you're doing and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you'd like it to work. Keys, screens or commands, if you have them in mind.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now instead
